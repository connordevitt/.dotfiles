# stylua formats this repo's Lua on save (see lua/plugins/format.lua).
# Matches the style already used in wezterm.lua: 2 spaces, single quotes.
column_width = 110
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferSingle"
call_parentheses = "None"
collapse_simple_statement = "Always"
